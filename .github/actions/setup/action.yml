# pnpm, Node and the dependencies, on either kind of runner CI uses (ADR 0630).
#
# - On a Namespace runner (`runner.environment` is `self-hosted`), the pnpm store and Playwright's
#   browsers live on the runner profile's cache volume (nscloud-cache-action), and setup-node's own
#   cache is off. Which branches may write that volume is set on the profile, not here.
# - On a GitHub-hosted runner (pull requests from forks, or the fallback in ci.yml's `changes`
#   job), setup-node caches the pnpm store in GitHub's cache, as before, and the browsers download.
#
# The repository must be checked out first: this action lives in it, and checkout empties the
# workspace the cache action links into.
name: Set up the workspace
description: pnpm, Node from .nvmrc, the cache for the runner, pnpm install, and optionally Playwright's Chromium.

inputs:
  playwright:
    description: The package (a pnpm --filter) whose Playwright installs Chromium; empty for none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
        package-manager-cache: ${{ runner.environment == 'github-hosted' }}

    # After pnpm/action-setup: the `pnpm` mode asks pnpm where its store is.
    - if: runner.environment != 'github-hosted'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: |
          pnpm
          ${{ inputs.playwright != '' && 'playwright' || '' }}

    - shell: bash
      run: pnpm install --frozen-lockfile

    # The browser comes from the cache volume on Namespace; `--with-deps` still installs the
    # system libraries Chromium needs (apt), which the cache does not hold.
    - if: inputs.playwright != ''
      shell: bash
      env:
        PACKAGE: ${{ inputs.playwright }}
      run: pnpm --filter "$PACKAGE" exec playwright install --with-deps chromium
