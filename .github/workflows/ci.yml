name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documents get a fast lane: when everything a change touches is under docs/ or is a Markdown
  # file at the root (scripts/ci-docs-only.mjs), the build, unit and Playwright jobs are skipped
  # and only the document checks run. If the diff cannot be worked out, everything runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || files=""
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER") || files=""
          fi
          docs_only=$(printf '%s\n' "$files" | node scripts/ci-docs-only.mjs) || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documents only: $docs_only"

  docs:
    name: Documents
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Without this, setup-node sees `packageManager` in package.json and looks for pnpm to
          # cache for it, which this job never installs.
          package-manager-cache: false
      # No install: these checks use Node alone.
      - run: node scripts/check-stray-names.mjs
      - run: node scripts/check-skills-version.mjs

  check:
    name: Lint, typecheck, unit tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Cap parallel packages: the vendored gatekeepers add thousands of CPU-heavy tests, and running
      # every package at once on a 4-vCPU runner makes timing- and startup-sensitive tests flake.
      - run: pnpm test --concurrency=2
      # Wall-clock-sensitive vendored tests, run alone so CPU contention doesn't fail them.
      - run: pnpm --filter @composable-os/gatekeeper-microsoft test:timing
      # The landing page (apps/marketing): its build fails on any tracker or third-party load.
      - run: pnpm --filter @composable-os/marketing build

  marketing-e2e:
    name: Landing page (Playwright)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @composable-os/marketing exec playwright install --with-deps chromium
      # Builds the site and serves it with the real Worker and a local D1 (playwright.config.ts).
      - run: pnpm --filter @composable-os/marketing test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marketing-playwright-report
          path: |
            apps/marketing/playwright-report
            apps/marketing/test-results
          retention-days: 7

  e2e:
    name: E2E smoke (Playwright)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @composable-os/app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The SaaS control plane in fake mode (Stage 10): sign-up → trial → provisioned workspace.
      - run: pnpm --filter @composable-os/control test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/app/playwright-report
            apps/app/test-results
            products/crm/apps/control/playwright-report
            products/crm/apps/control/test-results
          retention-days: 7
