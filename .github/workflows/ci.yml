name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documents get a fast lane: when everything a change touches is under docs/ or is a Markdown
  # file at the root (scripts/ci-docs-only.mjs), the build, unit and Playwright jobs are skipped
  # and only the document checks run. If the diff cannot be worked out, everything runs.
  #
  # This job also picks the runner every job that does real work runs on (ADR 0630, and
  # CONTRIBUTING.md, How CI is laid out). It and the small jobs (the documents check and the two
  # that gather results) stay on GitHub-hosted runners: they take seconds, and GitHub starts them
  # in one or two.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      unit_matrix: ${{ steps.unit.outputs.matrix }}
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      # The one place the runner is chosen.
      # - A pull request from a fork runs on GitHub's runners, always: a stranger's change must not
      #   spend this repository's Namespace minutes or read its cache volume. (A pull request whose
      #   head repository is gone counts as a fork.)
      # - Everything else (pushes to main, pull requests from this repository's branches) runs on
      #   the Namespace profile, unless the repository variable CI_RUNNER names another runner:
      #   set it to `ubuntu-latest` (Settings → Secrets and variables → Actions → Variables) to
      #   move CI back to GitHub's runners without a commit, for instance when Namespace is down.
      - id: runner
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          OVERRIDE: ${{ vars.CI_RUNNER }}
        run: |
          if [ "$FORK" = true ]; then
            runner=ubuntu-latest
          else
            runner=${OVERRIDE:-namespace-profile-composable-os}
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Jobs run on: $runner"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || files=""
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER") || files=""
          fi
          docs_only=$(printf '%s\n' "$files" | node scripts/ci-docs-only.mjs) || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documents only: $docs_only"
      # The unit test shards, from the one list in scripts/ci-unit-shards.mjs (Node alone).
      - id: unit
        run: echo "matrix=$(node scripts/ci-unit-shards.mjs --matrix)" >> "$GITHUB_OUTPUT"

  docs:
    name: Documents
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Without this, setup-node sees `packageManager` in package.json and looks for pnpm to
          # cache for it, which this job never installs.
          package-manager-cache: false
      # No install: these checks use Node alone.
      - run: node scripts/check-stray-names.mjs
      - run: node scripts/check-skills-version.mjs

  # Lint, typecheck and unit tests run as parallel jobs (the unit tests as a matrix of shards). The
  # job named "Lint, typecheck, unit tests" (`check`, below) only gathers their results, so the
  # required check keeps its name. A matrix job's result is success only if every shard passed.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # The landing page (apps/marketing): its build fails on any tracker or third-party load.
      - run: pnpm --filter @composable-os/marketing build

  # The unit tests, split across runners by measured time (scripts/ci-unit-shards.mjs says which
  # packages each shard runs, and `pnpm lint` checks that every package's tests run exactly once).
  # Each shard is `turbo run test` over its packages, so tests still get their `^typecheck` first;
  # nothing is cached between runs. The gatekeepers and the rest keep `--concurrency=2`, and the
  # gatekeepers' shard then runs gatekeeper-microsoft's timing tests alone.
  unit:
    name: Unit ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    strategy:
      # Let every shard finish, so one failure shows all the others too.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: node scripts/ci-unit-shards.mjs --run "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}

  # The npm packages a client repo installs (ADR 0423), as the release's build job makes them:
  # the release bundle, every package's tarball from this commit (`npm-packages.ts`: a pack's
  # declarations are emitted here and nowhere else, so a type that only fails declaration emit
  # shows here), a fresh client repo made, type-checked and built from them
  # (`check-npm-packages.ts`), and `npm publish --dry-run` on every tarball. The release would
  # fail on any of these; this finds it on the pull request instead.
  npm:
    name: npm packages
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: The release bundle (for the client repo the check makes)
        run: node scripts/release/build-release.ts --version 0.0.0-beta.0 --out release-out
      - name: The npm packages, and a fresh client repo built from them
        run: |
          node scripts/release/npm-packages.ts --version 0.0.0-beta.0 --out npm-out
          node scripts/release/check-npm-packages.ts --npm npm-out --bundle-dir release-out --version 0.0.0-beta.0
      - name: npm publish --dry-run on every tarball
        run: |
          for t in $(node -p "require('./npm-out/tarballs.json').join(' ')"); do
            npm publish "./npm-out/$t" --dry-run --access public --tag ci --provenance=false
          done

  # The required check. It runs even when a job it needs failed or was skipped (`always()`), and
  # passes only if all of them passed (lint, typecheck, the unit shards and the npm packages). On a documents-only change it is skipped, as the three are,
  # which branch protection counts as passing (as before the split).
  check:
    name: Lint, typecheck, unit tests
    needs: [changes, lint, typecheck, unit, npm]
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: All of them passed
        env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.unit.result }} ${{ needs.npm.result }}
        run: |
          echo "lint, typecheck, unit tests, npm packages: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  marketing-e2e:
    name: Landing page (Playwright)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: "@composable-os/marketing"
      # Builds the site and serves it with the real Worker and a local D1 (playwright.config.ts).
      - run: pnpm --filter @composable-os/marketing test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marketing-playwright-report
          path: |
            apps/marketing/playwright-report
            apps/marketing/test-results
          retention-days: 7

  # The app's Playwright suite, split across four runners (`--shard`). Each shard starts its own
  # dev server and local D1, so specs never share a database across shards. The job named
  # "E2E smoke (Playwright)" (`e2e`, below) gathers the shards and the control plane's suite, so
  # the required check keeps its name.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    strategy:
      # Let every shard finish, so one failure shows all the others too.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: "@composable-os/app"
      - run: pnpm --filter @composable-os/app test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/app/playwright-report
            apps/app/test-results
          retention-days: 7

  # The SaaS control plane in fake mode (Stage 10): sign-up → trial → provisioned workspace.
  e2e-control:
    name: E2E control plane
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: "@composable-os/control"
      - run: pnpm --filter @composable-os/control test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-control
          path: |
            products/crm/apps/control/playwright-report
            products/crm/apps/control/test-results
          retention-days: 7

  # The required check: passes only if every shard and the control plane passed (a failed,
  # cancelled or skipped one fails it). Skipped on a documents-only change, as the shards are.
  e2e:
    name: E2E smoke (Playwright)
    needs: [changes, e2e-shard, e2e-control]
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULTS: ${{ needs.e2e-shard.result }} ${{ needs.e2e-control.result }}
        run: |
          echo "shards, control plane: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
